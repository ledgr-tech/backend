name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Os jobs só fazem checkout e rodam testes: leitura do repositório basta. Sem
# este bloco o GITHUB_TOKEN herda a permissão padrão do repositório, que pode
# incluir escrita (issue #102).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Postgres real, antecipado do Sprint 6 (issue #12): ON CONFLICT DO
      # NOTHING é sintaxe de dialeto Postgres, não valida contra SQLite/dummy
      # — um teste que dá skip sem Postgres disponível deixaria a CI verde
      # sem checar o comportamento mais crítico da normalização (dedup).
      postgres:
        # postgres:18-alpine pra CI testar a mesma major da produção
        # (o Postgres do Railway é 18, imagem postgres-ssl:18 — issue #65).
        # Antes era 16: a CI passava numa major que produção não usa.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Settings() (app/core/config.py) exige DATABASE_URL só pra instanciar,
      # mesmo em testes que não tocam banco de verdade (create_engine não
      # conecta até a primeira query). Credenciais batem com o service
      # container acima — agora aponta pra um Postgres real, não um dummy.
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: black --check .
      - run: ruff check .
      - run: alembic upgrade head
      # Barra model sem migração. Virou obrigatório na issue #65: o deploy roda
      # `alembic upgrade head` sozinho no pre-deploy, então um model que mudou
      # sem migração não falha mais no deploy — passa batido e deixa o schema
      # de produção diferente do que o código espera.
      - run: alembic check
      # Os testes de volume (marcador `volume`, issue #74) rodam no job abaixo.
      - run: pytest -m "not volume"

  volume:
    # Testes de volume e tempo, separados da suíte principal (issue #74): são
    # lentos e sensíveis ao desempenho do runner. Rodam em paralelo ao job
    # `test`, com o mesmo Postgres. `-s` mostra os tempos no log.
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:18-alpine pra CI testar a mesma major da produção
        # (o Postgres do Railway é 18, imagem postgres-ssl:18 — issue #65).
        # Antes era 16: a CI passava numa major que produção não usa.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest -m volume -s
